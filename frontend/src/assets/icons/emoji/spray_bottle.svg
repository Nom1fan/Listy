<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="spray bottle">
  <defs>
    <linearGradient id="gBottle" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6EC6FF"/>
      <stop offset="1" stop-color="#1E88E5"/>
    </linearGradient>
    <linearGradient id="gTrigger" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F7F7F7"/>
      <stop offset="1" stop-color="#DADADA"/>
    </linearGradient>
  </defs>

  <!-- Spray dots -->
  <circle cx="50" cy="16" r="2" fill="#A7D8FF"/>
  <circle cx="56" cy="18" r="1.6" fill="#A7D8FF"/>
  <circle cx="52" cy="22" r="1.4" fill="#A7D8FF"/>

  <!-- Nozzle -->
  <path d="M29 12h16c2 0 3 1 3 3v4H37l-8-7z" fill="#B0BEC5"/>
  <path d="M48 15c3 0 6 1 8 3l-3 4c-2-1-4-2-6-2h-1v-5h2z" fill="#90A4AE"/>

  <!-- Trigger + head -->
  <path d="M22 10h12l9 8H31c-2 0-3-1-4-2l-5-6z" fill="url(#gTrigger)"/>
  <path d="M24 18h15v5H26c-2 0-2-2-2-5z" fill="#CFD8DC"/>
  <path d="M33 23h6c2 0 3 2 3 4v1h-5c-2 0-4-2-4-5z" fill="#B0BEC5"/>

  <!-- Bottle body -->
  <path
    d="M24 26h18c2 0 4 2 4 4v26c0 4-3 6-7 6H25c-4 0-7-2-7-6V30c0-2 2-4 4-4z"
    fill="url(#gBottle)"
  />

  <!-- Label -->
  <path d="M24 36h22c1 0 2 1 2 2v10c0 1-1 2-2 2H24c-1 0-2-1-2-2V38c0-1 1-2 2-2z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M26 40h18v2H26z" fill="#1565C0" opacity="0.7"/>
  <path d="M26 44h14v2H26z" fill="#1565C0" opacity="0.5"/>

  <!-- Shine -->
  <path d="M22 31c0-1 1-2 2-2h3v28h-2c-2 0-3-1-3-3V31z" fill="#FFFFFF" opacity="0.18"/>
</svg>

